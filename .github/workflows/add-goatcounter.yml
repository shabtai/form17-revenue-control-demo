name: Add GoatCounter once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Add one-time GoatCounter update workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add GoatCounter tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '''<script data-goatcounter="https://natural-joints.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>'''
          if 'data-goatcounter="https://natural-joints.goatcounter.com/count"' not in s:
              s = s.replace('</head>', tag + '\n</head>', 1)
              p.write_text(s)
          Path('.github/workflows/add-goatcounter.yml').unlink()
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-goatcounter.yml
          git commit -m "Add GoatCounter analytics"
          git push
